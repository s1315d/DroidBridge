<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DroidBridge WiFi Share</title>
  <style nonce="__NONCE__">
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: rgba(255, 255, 255, 0.06);
      --primary: #6c5ce7;
      --primary-glow: rgba(108, 92, 231, 0.3);
      --text: #e8e8f0;
      --text-muted: #8888a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 10px;
    }
    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .card {
      width: 100%;
      max-width: 450px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      display: block;
      transition: all 0.2s ease;
      position: relative;
    }
    .upload-zone:active, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(108, 92, 231, 0.05);
      box-shadow: 0 0 15px var(--primary-glow);
    }
    .upload-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .upload-text {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .upload-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    #file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.001;
      z-index: 10;
      cursor: pointer;
      display: block;
    }
    .progress-container {
      margin-top: 16px;
      display: none;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #a29bfe);
      border-radius: 3px;
      transition: width 0.1s ease;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .browser-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .back-btn:active {
      background: var(--primary);
      border-color: var(--primary);
    }
    .current-path {
      font-size: 12px;
      font-family: monospace;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .file-item:active {
      background: rgba(255, 255, 255, 0.04);
    }
    .file-left-group {
      display: flex;
      align-items: center;
      overflow: hidden;
      margin-right: 12px;
    }
    .file-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      margin-right: 12px;
    }
    .file-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      margin-right: 12px;
    }
    .file-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .file-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .preview-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .download-btn, .open-btn {
      background: rgba(108, 92, 231, 0.1);
      border: 1px solid rgba(108, 92, 231, 0.2);
      color: var(--primary-light);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .download-btn:active, .open-btn:active {
      background: var(--primary);
      color: white;
    }
    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .footer {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: auto;
      padding-top: 20px;
      text-align: center;
    }

    /* Modal Preview Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }
    .hidden { display: none !important; }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #modal-filename {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .modal-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      min-height: 200px;
      background: #000;
    }
    .modal-body img, .modal-body video {
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📶</div>
    <h1>DroidBridge Wi-Fi Share</h1>
    <div class="subtitle">Designed by Shubham Gour</div>
  </div>

  <div class="card">
    <div class="upload-zone" id="drop-zone">
      <div class="upload-icon">📤</div>
      <div class="upload-text">Upload files to Mac</div>
      <div class="upload-sub">Tap here to choose files</div>
      <input type="file" id="file-input" multiple>
    </div>

    <div class="progress-container" id="progress-box">
      <div class="progress-info">
        <span id="progress-file">File Name</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Download from Mac</div>
    
    <div class="browser-header">
      <button class="back-btn hidden" id="btn-back">← Back</button>
      <span class="current-path" id="path-display">📁 __FOLDER_NAME__</span>
    </div>

    <ul class="file-list" id="files-container">
      <li class="empty-state">Loading shared files...</li>
    </ul>
  </div>

  <div class="footer">
    Powered by DroidBridge • Both devices must be on the same Wi-Fi
  </div>

  <!-- Modal Preview Overlay -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-content" id="modal-card">
      <div class="modal-header">
        <span id="modal-filename">File Preview</span>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script nonce="__NONCE__">
    const fileInput = document.getElementById('file-input');
    const progressBox = document.getElementById('progress-box');
    const progressFile = document.getElementById('progress-file');
    const progressPercent = document.getElementById('progress-percent');
    const progressFill = document.getElementById('progress-fill');
    const filesContainer = document.getElementById('files-container');
    const pathDisplay = document.getElementById('path-display');
    const btnBack = document.getElementById('btn-back');

    let currentPath = '';

    function openPreview(fileName, relativePath) {
      const modal = document.getElementById('preview-modal');
      const title = document.getElementById('modal-filename');
      const body = document.getElementById('modal-body');
      
      title.textContent = fileName;
      body.innerHTML = '';
      
      const fileUrl = '/download?file=' + encodeURIComponent(relativePath);
      const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';
      const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
      const videoExts = ['mp4', 'mov', 'webm', 'mkv', 'avi', 'm4v', '3gp'];

      if (imageExts.includes(ext)) {
        const img = document.createElement('img');
        img.src = fileUrl + '&inline=1';
        body.appendChild(img);
      } else if (videoExts.includes(ext)) {
        const video = document.createElement('video');
        video.src = fileUrl + '&inline=1';
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        body.appendChild(video);
      } else if (ext === 'pdf' || ext === 'txt' || ext === 'html' || ext === 'json') {
        window.open(fileUrl + '&inline=1', '_blank');
        return;
      } else {
        window.open(fileUrl + '&dl=1', '_blank');
        return;
      }
      
      modal.classList.add('active');
    }

    function closePreviewModal(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      const modal = document.getElementById('preview-modal');
      const body = document.getElementById('modal-body');
      if (body) {
        const mediaElements = body.querySelectorAll('video, audio');
        mediaElements.forEach(m => {
          try {
            m.pause();
            m.src = '';
            m.load();
          } catch(err) {}
        });
        body.innerHTML = '';
      }
      if (modal) modal.classList.remove('active');
    }

    function getFilePreviewElement(fileName, relativePath, isDirectory) {
      if (isDirectory) {
        const div = document.createElement('div');
        div.className = 'file-icon-badge';
        div.textContent = '📁';
        return div;
      }
      
      const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';
      const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
      const videoExts = ['mp4', 'mov', 'webm', 'mkv', 'avi', 'm4v', '3gp'];
      const fileUrl = '/download?file=' + encodeURIComponent(relativePath);
      
      if (imageExts.includes(ext)) {
        const img = document.createElement('img');
        img.className = 'file-thumb';
        img.loading = 'lazy';
        img.alt = 'preview';
        img.src = fileUrl;
        img.onerror = function() {
          const badge = document.createElement('div');
          badge.className = 'file-icon-badge';
          badge.textContent = '🖼️';
          img.replaceWith(badge);
        };
        return img;
      }

      if (videoExts.includes(ext)) {
        const video = document.createElement('video');
        video.className = 'file-thumb';
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        video.src = fileUrl + '#t=0.5';
        video.onerror = function() {
          const badge = document.createElement('div');
          badge.className = 'file-icon-badge';
          badge.textContent = '🎬';
          video.replaceWith(badge);
        };
        return video;
      }

      const iconMap = {
        mp3: '🎵', wav: '🎵', flac: '🎵', m4a: '🎵', ogg: '🎵',
        pdf: '📕', doc: '📘', docx: '📘', txt: '📝', json: '💻',
        zip: '📦', rar: '📦', '7z': '📦', tar: '📦', gz: '📦',
        apk: '📲', dmg: '💿'
      };
      
      const badge = document.createElement('div');
      badge.className = 'file-icon-badge';
      badge.textContent = iconMap[ext] || '📄';
      return badge;
    }

    // Load files list
    async function loadFiles() {
      try {
        const res = await fetch('/files?path=' + encodeURIComponent(currentPath));
        const data = await res.json();
        const files = Array.isArray(data) ? data : (data.files || []);
        const rootFolderName = (data && data.folderName) ? data.folderName : 'Shared';
        
        // Update breadcrumb UI
        pathDisplay.textContent = currentPath ? '📁 ' + rootFolderName + ' / ' + currentPath : '📁 ' + rootFolderName;
        btnBack.classList.toggle('hidden', !currentPath);

        filesContainer.innerHTML = '';
        if (files.length === 0) {
          filesContainer.innerHTML = '<li class="empty-state">No items in this folder</li>';
          return;
        }
        
        files.forEach(f => {
          const item = document.createElement('li');
          item.className = 'file-item';
          
          const relativeFilePath = currentPath ? currentPath + '/' + f.name : f.name;
          const previewEl = getFilePreviewElement(f.name, relativeFilePath, f.isDirectory);

          const leftGroup = document.createElement('div');
          leftGroup.className = 'file-left-group';
          leftGroup.appendChild(previewEl);

          const details = document.createElement('div');
          details.className = 'file-details';
          
          const nameSpan = document.createElement('span');
          nameSpan.className = 'file-name';
          nameSpan.textContent = f.name;

          const sizeSpan = document.createElement('span');
          sizeSpan.className = 'file-size';
          sizeSpan.textContent = f.isDirectory ? 'Folder' : formatBytes(f.size);

          details.appendChild(nameSpan);
          details.appendChild(sizeSpan);
          leftGroup.appendChild(details);

          item.appendChild(leftGroup);

          const actionGroup = document.createElement('div');
          actionGroup.className = 'action-group';

          if (f.isDirectory) {
            const zipBtn = document.createElement('a');
            zipBtn.className = 'download-btn';
            zipBtn.href = '/download-folder?folder=' + encodeURIComponent(relativeFilePath);
            zipBtn.textContent = '📦 ZIP';
            zipBtn.style.marginRight = '6px';
            actionGroup.appendChild(zipBtn);

            const openBtn = document.createElement('button');
            openBtn.className = 'open-btn';
            openBtn.textContent = 'Open ➔';
            openBtn.onclick = () => navigateInto(f.name);
            actionGroup.appendChild(openBtn);
          } else {
            const ext = f.name.includes('.') ? f.name.split('.').pop().toLowerCase() : '';
            const previewableExts = [
              // Images
              'jpg', 'jpeg', 'png', 'gif', 'webp', 'svg',
              // Videos
              'mp4', 'mov', 'webm', 'mkv', 'avi', 'm4v', '3gp',
              // Audio
              'mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac',
              // Docs/Text
              'pdf', 'txt', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'json', 'html', 'xml', 'csv'
            ];

            if (previewableExts.includes(ext)) {
              const previewBtn = document.createElement('button');
              previewBtn.className = 'preview-btn';
              previewBtn.textContent = '👁️ Preview';
              previewBtn.onclick = () => openPreview(f.name, relativeFilePath);
              actionGroup.appendChild(previewBtn);
            }

            const dlBtn = document.createElement('a');
            dlBtn.className = 'download-btn';
            dlBtn.href = '/download?file=' + encodeURIComponent(relativeFilePath);
            dlBtn.textContent = '⬇️ Download';
            actionGroup.appendChild(dlBtn);
          }

          item.appendChild(actionGroup);
          filesContainer.appendChild(item);
        });
      } catch (err) {
        filesContainer.innerHTML = '<li class="empty-state">Failed to load files</li>';
      }
    }

    function navigateInto(dirName) {
      currentPath = currentPath ? currentPath + '/' + dirName : dirName;
      loadFiles();
    }

    function navigateBack() {
      const parts = currentPath.split('/');
      parts.pop();
      currentPath = parts.join('/');
      loadFiles();
    }

    // Format bytes
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // Upload handlers
    fileInput.addEventListener('change', async (e) => {
      const files = e.target.files;
      if (files.length === 0) return;
      
      progressBox.style.display = 'block';
      
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        progressFile.textContent = file.name;
        progressPercent.textContent = '0%';
        progressFill.style.width = '0%';

        try {
          await uploadFile(file);
        } catch (err) {
          alert('Upload failed: ' + file.name);
        }
      }
      
      progressBox.style.display = 'none';
      fileInput.value = '';
      loadFiles();
    });

    function uploadFile(file) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const uploadPath = currentPath ? currentPath + '/' + file.name : file.name;
        xhr.open('POST', '/upload');
        xhr.setRequestHeader('X-File-Name', encodeURIComponent(uploadPath));
        
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            progressPercent.textContent = pct + '%';
            progressFill.style.width = pct + '%';
          }
        };

        xhr.onload = () => {
          if (xhr.status === 200) resolve();
          else reject();
        };
        xhr.onerror = () => reject();
        xhr.send(file);
      });
    }

    // Drop zone highlighting
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const droppedFiles = e.dataTransfer.files;
      if (droppedFiles.length > 0) {
        progressBox.style.display = 'block';
        for (let i = 0; i < droppedFiles.length; i++) {
          const file = droppedFiles[i];
          progressFile.textContent = file.name;
          progressPercent.textContent = '0%';
          progressFill.style.width = '0%';
          try {
            await uploadFile(file);
          } catch (err) {
            alert('Upload failed: ' + file.name);
          }
        }
        progressBox.style.display = 'none';
        loadFiles();
      }
    });

    // Modal & Back Button Event Listeners
    btnBack.addEventListener('click', navigateBack);
    document.getElementById('modal-close-btn')?.addEventListener('click', closePreviewModal);
    const previewModal = document.getElementById('preview-modal');
    if (previewModal) {
      previewModal.addEventListener('click', (e) => {
        if (e.target === previewModal) closePreviewModal();
      });
    }

    // Boot
    loadFiles();
  </script>
</body>
</html>
